body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:11px 12px}

.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g button{text-align:left}
.opt{display:block;width:100%;margin:6px 0;text-align:left;font-size:16px}
.ok{background:#2e9d4a!important;color:#fff!important}.no{background:#d0463b!important;color:#fff!important}
.big{font-size:56px;text-align:center;line-height:1.1}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);display:inline-block;margin:1px}
svg{max-width:100%;height:auto;display:block;margin:0 auto}svg text{fill:var(--fg);font-size:9px}
canvas{width:100%;max-width:340px;display:block;margin:6px auto;border-radius:12px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
input{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);width:100%;margin:6px 0}

let L=0,S,view=menu,aiming=false,raf=0;
const $=s=>document.querySelector(s),t=s=>{const a=s.split("|");return a[L]||a[0]},app=$("#app");
const ST=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}};
function head(){return `<header><h1>🗑️ ${t("Sains Buang Sampah! Year 3|Sains Buang Sampah! Tahun 3")}</h1><button onclick="L=1-L;view()">${L?"English":"Bahasa Melayu"}</button></header>`}
function menu(){view=menu;
app.innerHTML=head()+`<p>${t("Pick a topic. Answer correctly to throw your rubbish into the bin!|Pilih topik. Jawab dengan betul untuk membuang sampah ke dalam tong!")}</p><div class="g">${T.map((o,i)=>`<button onclick="start(${i})"><div style="font-size:30px">${o.e}</div><b>${i+1}. ${t(o.n)}</b><br><small>8 ${t("questions|soalan")}</small></button>`).join("")}</div><button class="opt" onclick="board()">🏆 ${t("Leaderboard|Papan Pendahulu")}</button>`}
function start(i){S={t:i,q:0,c:0,b:0,o:null};ask()}
function ask(){view=ask;const q=T[S.t].q[S.q];if(!S.o)S.o=[0,1,2].sort(()=>Math.random()-.5);
const lv=S.q<3?t("Easy|Mudah"):S.q<6?t("Medium|Sederhana"):t("Hard|Sukar");
app.innerHTML=head()+`<div class="card"><span class="tag">${t(T[S.t].n)}</span> <span class="tag">${S.q+1}/8 · ${lv}</span> <span class="tag">🗑️ ${S.b} · ✔ ${S.c}</span>
${D[S.t]&&S.q%2==0?D[S.t](S.q):""}<div class="big">${q[0]}</div><p><b>${t(q[1])}</b></p>
<div>${S.o.map(k=>`<button class="opt" onclick="ans(${k},this)">${t(q[2+k])}</button>`).join("")}</div><div id="fb"></div></div>`}
function ans(k,b){const ok=k==0,q=T[S.t].q[S.q];document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add(ok?"ok":"no");
if(ok){S.c++;S.r=["🥤","📄","🍌","🥫","🧃","🍎"][Math.floor(Math.random()*6)];$("#fb").innerHTML=`<p>✅ ${t("Correct! Throw your rubbish into the bin! Tap THROW when the arrow is in the green zone.|Betul! Buang sampah ke dalam tong! Tekan BALING apabila anak panah berada di zon hijau.")}</p><canvas id="cv" width="320" height="210"></canvas><button class="p opt" id="sb" onclick="shoot()">🗑️ ${t("THROW!|BALING!")}</button>`;aiming=true;aimLoop()}
else{document.querySelectorAll(".opt").forEach(x=>{if(x.textContent==t(q[2]))x.classList.add("ok")});$("#fb").innerHTML=`<p>❌ ${t("Not quite. The answer is in green.|Belum tepat. Jawapan ditunjukkan dengan hijau.")}</p><button class="p opt" onclick="next()">${t("Next|Seterusnya")} ➜</button>`}}
const LO=.69,HI=.85,X0=40,SP=300; // landing x = X0 + p*SP; bin opening ≈ 248..296
function draw(p,bx,by,rot){const c=$("#cv");if(!c)return;const x=c.getContext("2d");x.fillStyle="#cfe8ff";x.fillRect(0,0,320,210);x.fillStyle="#8cc06a";x.fillRect(0,190,320,20);
if(p!=null){x.fillStyle="#fff";x.fillRect(20,8,280,14);x.fillStyle="#58c26d";x.fillRect(20+280*LO,8,280*(HI-LO),14);x.strokeStyle="#333";x.strokeRect(20,8,280,14);x.fillStyle="#d0463b";x.beginPath();x.moveTo(20+280*p,32);x.lineTo(14+280*p,24);x.lineTo(26+280*p,24);x.fill()}
x.font="38px serif";x.textAlign="center";x.fillText("🧒",22,190);
x.font="26px serif";x.save();x.translate(bx,by);x.rotate(rot||0);x.fillText(S.r,0,8);x.restore();
x.fillStyle="#3a6e44";x.beginPath();x.moveTo(250,138);x.lineTo(294,138);x.lineTo(288,190);x.lineTo(256,190);x.fill();x.fillStyle="#2a5133";x.fillRect(245,132,54,8);x.fillStyle="#fff";x.font="18px sans-serif";x.fillText("♻",272,170)}
function aimLoop(){if(!aiming)return;S.p=.5+.5*Math.sin(performance.now()/420);draw(S.p,40,170,0);raf=requestAnimationFrame(aimLoop)}
function shoot(){if(!aiming)return;aiming=false;cancelAnimationFrame(raf);$("#sb").disabled=true;
const lx=X0+S.p*SP,win=S.p>=LO&&S.p<=HI,t0=performance.now(),ex=win?272:lx;
(function f(now){const k=Math.min(1,(now-t0)/950);draw(null,40+(ex-40)*k,170-(win?20:-0)*k-4*105*k*(1-k)+(win?0:0)+(win?0:15*k),k*7);
if(k<1)return requestAnimationFrame(f);if(win)S.b++;
$("#sb").outerHTML=`<p><b>${win?"🎉 "+t("In the bin! +5|Masuk tong! +5"):"😅 "+t("Missed! Try the next one.|Tersasar! Cuba lagi nanti.")}</b></p><button class="p opt" onclick="next()">${t("Next|Seterusnya")} ➜</button>`})(t0)}
function next(){S.q++;S.o=null;S.q<8?ask():end()}
function end(){view=end;const pts=S.c*10+S.b*5;
app.innerHTML=head()+`<div class="card"><div class="big">${S.c>=7?"🏆":S.c>=4?"🌟":"💪"}</div><h2>${t(T[S.t].n)}</h2><p>✔ ${t("Correct answers|Jawapan betul")}: <b>${S.c}/8</b><br>🗑️ ${t("Rubbish in the bin|Sampah masuk tong")}: <b>${S.b}</b><br>⭐ ${t("Points|Mata")}: <b>${pts}</b></p>
<input id="nm" maxlength="16" placeholder="${t("Your name|Nama anda")}"><button class="p opt" onclick="save(${pts})">🏆 ${t("Save to leaderboard|Simpan ke papan pendahulu")}</button><button class="opt" onclick="start(${S.t})">🔁 ${t("Play again|Main semula")}</button><button class="opt" onclick="menu()">☰ ${t("Topics|Topik")}</button></div>`}
function save(p){const n=($("#nm").value||"Murid").slice(0,16),a=ST("sb3");a.push({n,p,t:S.t});a.sort((x,y)=>y.p-x.p);try{localStorage.setItem("sb3",JSON.stringify(a.slice(0,50)))}catch(e){}board()}
function board(){view=board;const a=ST("sb3").slice(0,10);
app.innerHTML=head()+`<div class="card"><h2>🏆 ${t("Leaderboard|Papan Pendahulu")}</h2>${a.length?`<table><tr><th>#</th><th>${t("Name|Nama")}</th><th>${t("Topic|Topik")}</th><th>⭐</th></tr>${a.map((r,i)=>`<tr><td>${i+1}</td><td>${r.n.replace(/[<>&]/g,"")}</td><td>${T[r.t].e}</td><td>${r.p}</td></tr>`).join("")}</table>`:`<p>${t("No scores yet. Be the first!|Belum ada skor. Jadilah yang pertama!")}</p>`}<small>${t("Scores are saved on this device.|Skor disimpan pada peranti ini.")}</small></div><button class="opt" onclick="menu()">☰ ${t("Topics|Topik")}</button>`}
menu();
</script></body></html>
