<style>
:root{--bg:#fff7ec;--fg:#3a2410;--card:#fff;--ac:#f0731a;--bd:#f3d9bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c130b;--fg:#fbeedd;--card:#2a1d12;--ac:#ff9d4d;--bd:#4a3522}}
:root[data-theme="dark"]{--bg:#1c130b;--fg:#fbeedd;--card:#2a1d12;--ac:#ff9d4d;--bd:#4a3522}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g button{text-align:left}
.opt{display:block;width:100%;margin:6px 0;text-align:left;font-size:17px}
.ok{background:#2e9d4a!important;color:#fff!important}.no{background:#d0463b!important;color:#fff!important}
.big{font-size:60px;text-align:center;line-height:1.1}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);display:inline-block;margin:1px}
svg{max-width:100%;height:auto;display:block;margin:0 auto}svg text{fill:var(--fg);font-size:9px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
input{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);width:100%;margin:6px 0}
.ball{width:84px;height:84px;border-radius:50%;margin:8px auto;box-shadow:inset -8px -8px 14px rgba(0,0,0,.25),0 6px 10px rgba(0,0,0,.25);animation:bn .8s ease-in-out infinite alternate}
@keyframes bn{to{transform:translateY(-10px)}}
.bar{height:12px;border-radius:8px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pot{height:64px;border-radius:6px 6px 26px 26px;color:#fff;text-shadow:0 1px 3px #000;font-weight:700;font-size:16px;border:3px solid rgba(0,0,0,.25)}
</style></head><body><div id="app"></div>

$("#fb").innerHTML=`<p>✅ ${t("Correct! Colour match game: tap the pot that has the same colour as the ball!|Betul! Permainan padan warna: ketik periuk yang sama warna dengan bola!")}</p><div class="ball" style="background:${C[tg][0]}"></div><div class="bar"><i id="tb" style="transition:width ${sec}s linear"></i></div><div class="pots">${ix.map(j=>`<button class="pot" style="background:${C[j][0]}" onclick="pick(${j})">${t(C[j][1])}</button>`).join("")}</div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{const e=$("#tb");if(e)e.style.width="0%"}));tm=setTimeout(()=>pick(-1),sec*1000)}
function pick(j){clearTimeout(tm);const w=j==S.tg;if(w)S.m++;
$("#fb").innerHTML=`<div class="ball" style="background:${C[S.tg][0]}"></div><p><b>${w?"🎉 "+t("Great match! +5|Padanan hebat! +5"):j<0?"⏰ "+t("Time is up! It was |Masa tamat! Jawapannya ")+t(C[S.tg][1]):"😅 "+t("Oops! It was |Alamak! Jawapannya ")+t(C[S.tg][1])}</b></p><button class="p opt" onclick="next()">${t("Next|Seterusnya")} ➜</button>`}
function next(){S.q++;S.o=null;S.q<8?ask():end()}
function end(){view=end;const pts=S.c*10+S.m*5;
app.innerHTML=head()+`<div class="card"><div class="big">${S.c>=7?"🏆":S.c>=4?"🌟":"💪"}</div><h2>${t(T[S.t].n)}</h2><p>✔ ${t("Correct answers|Jawapan betul")}: <b>${S.c}/8</b><br>🎨 ${t("Colour matches|Padanan warna")}: <b>${S.m}</b><br>⭐ ${t("Points|Mata")}: <b>${pts}</b></p>
<input id="nm" maxlength="16" placeholder="${t("Your name|Nama anda")}"><button class="p opt" onclick="save(${pts})">🏆 ${t("Save to leaderboard|Simpan ke papan pendahulu")}</button><button class="opt" onclick="start(${S.t})">🔁 ${t("Play again|Main semula")}</button><button class="opt" onclick="menu()">☰ ${t("Topics|Topik")}</button></div>`}
function save(p){const n=($("#nm").value||"Murid").slice(0,16),a=ST("sc2");a.push({n,p,t:S.t});a.sort((x,y)=>y.p-x.p);try{localStorage.setItem("sc2",JSON.stringify(a.slice(0,50)))}catch(e){}board()}
function board(){view=board;clearTimeout(tm);const a=ST("sc2").slice(0,10);
app.innerHTML=head()+`<div class="card"><h2>🏆 ${t("Leaderboard|Papan Pendahulu")}</h2>${a.length?`<table><tr><th>#</th><th>${t("Name|Nama")}</th><th>${t("Topic|Topik")}</th><th>⭐</th></tr>${a.map((r,i)=>`<tr><td>${i+1}</td><td>${r.n.replace(/[<>&]/g,"")}</td><td>${T[r.t].e}</td><td>${r.p}</td></tr>`).join("")}</table>`:`<p>${t("No scores yet. Be the first!|Belum ada skor. Jadilah yang pertama!")}</p>`}<small>${t("Scores are saved on this device.|Skor disimpan pada peranti ini.")}</small></div><button class="opt" onclick="menu()">☰ ${t("Topics|Topik")}</button>`}
menu();
</script></body></html>
