let L=0,S,view=menu,aiming=false,raf=0;
const $=s=>document.querySelector(s),t=s=>{const a=s.split("|");return a[L]||a[0]},app=$("#app");
const ST=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}};
function head(){return `<header><h1>🎳 ${t("Sains Boling! Year 6|Sains Boling! Tahun 6")}</h1><button onclick="L=1-L;view()">${L?"English":"Bahasa Melayu"}</button></header>`}
function menu(){view=menu;
app.innerHTML=head()+`<p>${t("Pick a topic. Answer correctly to roll the ball and knock down the pins!|Pilih topik. Jawab dengan betul untuk menggolek bola dan menjatuhkan pin!")}</p><div class="g">${T.map((o,i)=>`<button onclick="start(${i})"><div style="font-size:30px">${o.e}</div><b>${i+1}. ${t(o.n)}</b><br><small>8 ${t("questions|soalan")}</small></button>`).join("")}</div><button class="opt" onclick="board()">🏆 ${t("Leaderboard|Papan Pendahulu")}</button>`}
function start(i){S={t:i,q:0,c:0,p:0,o:null};ask()}
function ask(){view=ask;const q=T[S.t].q[S.q];if(!S.o)S.o=[0,1,2].sort(()=>Math.random()-.5);
const lv=S.q<3?t("Easy|Mudah"):S.q<6?t("Medium|Sederhana"):t("Hard|Sukar");
app.innerHTML=head()+`<div class="card"><span class="tag">${t(T[S.t].n)}</span> <span class="tag">${S.q+1}/8 · ${lv}</span> <span class="tag">🎳 ${S.p} · ✔ ${S.c}</span>
${D[S.t]&&S.q%2==0?D[S.t]():""}<div class="big">${q[0]}</div><p><b>${t(q[1])}</b></p>
<div>${S.o.map(k=>`<button class="opt" onclick="ans(${k},this)">${t(q[2+k])}</button>`).join("")}</div><div id="fb"></div></div>`}
function ans(k,b){const ok=k==0,q=T[S.t].q[S.q];document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add(ok?"ok":"no");
if(ok){S.c++;$("#fb").innerHTML=`<p>✅ ${t("Correct! Roll your ball!|Betul! Golek bola anda!")}</p><canvas id="cv" width="320" height="230"></canvas><button class="p opt" id="sb" onclick="shoot()">🎳 ${t("ROLL!|GOLEK!")}</button>`;aiming=true;aimLoop()}
else{document.querySelectorAll(".opt").forEach(x=>{if(x.textContent==t(q[2]))x.classList.add("ok")});$("#fb").innerHTML=`<p>❌ ${t("Not quite. The answer is in green.|Belum tepat. Jawapan ditunjukkan dengan hijau.")}</p><button class="p opt" onclick="next()">${t("Next|Seterusnya")} ➜</button>`}}
const PINS=[];[[1,100],[2,82],[3,64],[4,46]].forEach(([n,y])=>{for(let i=0;i<n;i++)PINS.push({x:160+(i-(n-1)/2)*20,y})});
function draw(mx,bx,by,down){const c=$("#cv");if(!c)return;const x=c.getContext("2d");x.fillStyle="#241c3a";x.fillRect(0,0,320,230);
x.fillStyle="#555";x.fillRect(100,0,10,230);x.fillRect(210,0,10,230);x.fillStyle="#d9a65e";x.fillRect(110,0,100,230);x.strokeStyle="rgba(120,70,20,.35)";for(let i=120;i<210;i+=10){x.beginPath();x.moveTo(i,0);x.lineTo(i,230);x.stroke()}
PINS.forEach((p,i)=>{if(down&&down.has(i)){x.fillStyle="rgba(255,255,255,.35)";x.beginPath();x.ellipse(p.x+(i%2?10:-10),p.y+4,8,3,.4,0,7);x.fill()}else{x.fillStyle="#fff";x.beginPath();x.ellipse(p.x,p.y,5,8,0,0,7);x.fill();x.fillStyle="#d0463b";x.fillRect(p.x-4,p.y-3,8,3)}});
if(mx!=null){x.strokeStyle="#ffe14d";x.lineWidth=3;x.beginPath();x.moveTo(mx,125);x.lineTo(mx,150);x.moveTo(mx-8,138);x.lineTo(mx,125);x.lineTo(mx+8,138);x.stroke()}
const r=by>120?11:7;x.fillStyle="#2c5ee8";x.beginPath();x.arc(bx,by,r,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(bx-3,by-3,1.6,0,7);x.arc(bx+1,by-4,1.6,0,7);x.fill()}
function aimLoop(){if(!aiming)return;S.aim=160+46*Math.sin(performance.now()/450);draw(S.aim,160,205,null);raf=requestAnimationFrame(aimLoop)}
function shoot(){if(!aiming)return;aiming=false;cancelAnimationFrame(raf);$("#sb").disabled=true;
const ax=S.aim+(Math.random()-.5)*8,t0=performance.now(),dx=Math.abs(ax-160),gut=dx>48;
let n=gut?0:Math.max(0,10-Math.floor(dx/5)),down=new Set();
const order=PINS.map((p,i)=>i).sort((a,b)=>Math.abs(PINS[a].x-ax)-Math.abs(PINS[b].x-ax)),hit=new Set(order.slice(0,n));
(function f(now){const p=Math.min(1,(now-t0)/900);draw(null,160+(ax-160)*p,205-135*p,p>.85?hit:null);
if(p<1)return requestAnimationFrame(f);S.p+=n;
$("#sb").outerHTML=`<p><b>${n==10?"🎳 STRIKE! 10":gut?"😬 "+t("Gutter ball!|Bola masuk parit!"):"🎳 "+n+" "+t("pins down!|pin jatuh!")}</b></p><button class="p opt" onclick="next()">${t("Next|Seterusnya")} ➜</button>`})(t0)}
function next(){S.q++;S.o=null;S.q<8?ask():end()}
function end(){view=end;const pts=S.c*10+S.p;
app.innerHTML=head()+`<div class="card"><div class="big">${S.c>=7?"🏆":S.c>=4?"🌟":"💪"}</div><h2>${t(T[S.t].n)}</h2><p>✔ ${t("Correct answers|Jawapan betul")}: <b>${S.c}/8</b><br>🎳 ${t("Pins knocked down|Pin dijatuhkan")}: <b>${S.p}</b><br>⭐ ${t("Points|Mata")}: <b>${pts}</b></p>
<input id="nm" maxlength="16" placeholder="${t("Your name|Nama anda")}"><button class="p opt" onclick="save(${pts})">🏆 ${t("Save to leaderboard|Simpan ke papan pendahulu")}</button><button class="opt" onclick="start(${S.t})">🔁 ${t("Play again|Main semula")}</button><button class="opt" onclick="menu()">☰ ${t("Topics|Topik")}</button></div>`}
function save(p){const n=($("#nm").value||"Murid").slice(0,16),a=ST("sb6");a.push({n,p,t:S.t});a.sort((x,y)=>y.p-x.p);try{localStorage.setItem("sb6",JSON.stringify(a.slice(0,50)))}catch(e){}board()}
function board(){view=board;const a=ST("sb6").slice(0,10);
app.innerHTML=head()+`<div class="card"><h2>🏆 ${t("Leaderboard|Papan Pendahulu")}</h2>${a.length?`<table><tr><th>#</th><th>${t("Name|Nama")}</th><th>${t("Topic|Topik")}</th><th>⭐</th></tr>${a.map((r,i)=>`<tr><td>${i+1}</td><td>${r.n.replace(/[<>&]/g,"")}</td><td>${T[r.t].e}</td><td>${r.p}</td></tr>`).join("")}</table>`:`<p>${t("No scores yet. Be the first!|Belum ada skor. Jadilah yang pertama!")}</p>`}<small>${t("Scores are saved on this device.|Skor disimpan pada peranti ini.")}</small></div><button class="opt" onclick="menu()">☰ ${t("Topics|Topik")}</button>`}
menu();
</script></body></html>
